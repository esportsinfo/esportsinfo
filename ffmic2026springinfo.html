<!DOCTYPE html>
<html>
<head>
<title>BGMI Masters Series</title>

<style>

/* BODY */
body {
    margin: 0;
    font-family: Arial;
    background: #0a0a0a;
    color: white;
}
<!-- HEADER -->
    header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 20px;
}

.menu {
    font-size: 24px;
    cursor: pointer;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo img {
    height: 120px;
}
    /* DROPDOWN */
.dropdown {
    display: none;
    position: absolute;
    right: 10px;
    top: 60px;
    background: #111;
    padding: 10px;
    border-radius: 10px;
}

.dropdown a {
    display: block;
    color: white;
    padding: 10px;
    text-decoration: none;
}

.dropdown a:hover {
    background: orange;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: center;
    background: #1E90FF;
    border-bottom: 1px solid #222;
}

.navbar a {
    position: relative;
    text-decoration: none;
    color: white;
    padding: 20px 30px;
    font-size: 18px;
    font-weight: bold;
    transition: 0.3s;
}

.navbar a:hover {
    color: orange;
}

.navbar a::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 10px;
    width: 0;
    height: 2px;
    background: orange;
    transition: 0.3s;
    transform: translateX(-50%);
}

.navbar a:hover::after {
    width: 60%;
}

/* ACTIVE */
.active {
    color: orange !important;
}

.active::after {
    width: 60%;
}
    /* BODY HEADER */
    tournment-card {
    background: #/* TEAM CARD */;
    border-radius: 12px;
    padding: 15px;
    transition: 0.3s;
    text-align: center;
    width: 220px;
    height: 250px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
    .tour-logo {
    width: 120px;     /* adjust size */
    height: 120px;
    object-fit: contain;
}

/* DETAILS BOX (GLASS EFFECT) */
.details {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    margin: 30px auto;
    padding: 25px;
    width: 350px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(255,165,0,0.3);
}

.details p {
    margin: 12px 0;
    font-size: 15px;
}

/* TEAM SECTION */
.teams {
    text-align: center;
}

.team-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 20px;
}

/* TEAM CARD */
.team-card {
    background: #111;
    border-radius: 12px;
    padding: 15px;
    transition: 0.3s;
    text-align: center;
    width: 220px;
    height: 250px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.team-card img {
    width: 60px;
    margin-bottom: 10px;
}

.team-card:hover {
    transform: scale(1.08);
    box-shadow: 0 0 15px #00bfff;
}

/* LINKS */
a {
    text-decoration: none;
    color: white;
}

</style>
        <script>
        function toggleMenu() {
    var menu = document.getElementById("dropdown");
    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }
}
    </script>
</head>

<body>
<!-- HEADER -->
<header>
    <div class="logo">
        <img src="lgo.png">
        <h2>ESPORTS INFO</h2>
    </div>
    
    <div class="menu" onclick="toggleMenu()">☰</div>
</header>

<div id="dropdown" class="dropdown">
    <a href="#">Instagram</a>
    <a href="#">WhatsApp</a>
    <a href="#">X</a>
</div>


<!-- NAVBAR -->
<div class="navbar">
    <a href="index.html">Home</a>
    <a href="tournament.html" class="active">Tournament</a>
    <a href="team.html">Player</a>
    <a href="ranking.html">Ranking</a>
</div>

<!-- BODY HEADER -->
<div class="tournament-card">
    <img src="ffmic2026springlogo.png" class="tour-logo">
    <h1>FFMIC 2026 SPRING</h1>
</div>

<!-- DETAILS -->
<div class="details">
    <p>🔱 Mode: Online & Offline</p>
    <p>📋 Format: Squad</p>
    <p>💰 Prize Pool: ₹1,00,00,000</p>
    <p>📅 Date: March 2026</p>
</div>

<!-- TEAMS -->
<div class="teams">
    <h2 style="color:orange;">Participating Teams</h2>

    <div class="team-list">

        <a href="godlikeinfo.html">
            <div class="team-card">
                <img src="godlike.png">
                <p>Godlike Esports</p>
            </div>
        </a>

        <a href="reckoninginfo.html">
            <div class="team-card">
                <img src="reckoninglogo.png">
                <p>Reckoning Esports</p>
            </div>
        </a>

        <a href="team3.html">
            <div class="team-card">
                <img src="team3.png">
                <p>Team Gamma</p>
            </div>
        </a>

        <a href="team4.html">
            <div class="team-card">
                <img src="team4.png">
                <p>Team Delta</p>
            </div>
        </a>

    </div>
</div>

</body>
</html>
