<!DOCTYPE html>
<html>
<head>
<title>Esports Info</title>

<style>

/* BODY */
body {
    margin: 0;
    font-family: Arial;
    background: #0a0a0a;
    color: white;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    background: black;
    border-bottom: ;
}

/* LOGO */
.logo {
    display: flex;
    align-items: center;
    gap: 5px;
}

.logo img {
    height: 120px;
}

.logo span {
    color: White;
    font-size: 30px;
    font-weight: bold;
}

/* MENU */
.menu {
    font-size: 25px;
    cursor: pointer;
}

/* DROPDOWN */
.dropdown {
    display: none;
    position: absolute;
    right: 10px;
    top: 60px;
    background: #111;
    padding: 10px;
    border-radius: 10px;
}

.dropdown a {
    display: block;
    color: white;
    padding: 10px;
    text-decoration: none;
}

.dropdown a:hover {
    background: orange;
}
        .navbar {
    display: flex;
    justify-content: center;
    background:#1E90FF;
    position: relative;
}
    .navbar div:hover {
    Background:#FF8C00;
}

/* Links */
.navbar a {
    position: relative;
    text-decoration: none;
    color: white;
    padding: 20px 30px;
    font-size: 18px;
    font-weight: bold;
    transition: 0.3s;
}
    
/* Animated underline */
.navbar a::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 10px;
    width: 0;
    height: 2px;
    background: orange;
    transition: 0.3s;
    transform: translateX(-50%);
}

/* Expand line on hover */
.navbar a:hover::after {
    width: 60%;
}

/* ACTIVE TAB */
.active {
    color: orange !important;
}

.active::after {
    width: 60%;
}
    
/* Animated underline */
.navbar a::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 10px;
    width: 0;
    height: 2px;
    background: orange;
    transition: 0.3s;
    transform: translateX(-50%);
}

/* Expand line on hover */
.navbar a:hover::after {
    width: 60%;
}

/* PAGE CONTENT */
.content {
    padding: 30px;
    text-align: center;
}

/* FOOTER */
footer {
    background: #0a0a0a;
    border-top: 1px solid #222;
    margin-top: 40px;
    padding: 20px 10px;
    text-align: center;
}

.footer-content h3 {
    color: orange;
    margin-bottom: 10px;
}

.footer-content p {
    color: #aaa;
    font-size: 14px;
}

.footer-links {
    margin: 15px 0;
}

.footer-links a {
    color: white;
    margin: 0 10px;
    text-decoration: none;
    font-size: 14px;
}

.footer-links a:hover {
    color: orange;
}

.copyright {
    margin-top: 10px;
    font-size: 12px;
    color: #666;
}

</style>

    <script>
    function toggleMenu() {
    var menu = document.getElementById("dropdown");
    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }
}
        function showSection(id) {
    document.getElementById("home").style.display = "none";
    document.getElementById("tournament").style.display = "none";
    document.getElementById("player").style.display = "none";
    document.getElementById("ranking").style.display = "none";

    document.getElementById(id).style.display = "block";
}
        </script>
</head>

<body>

</div>

</header>

</div>

<footer>

    </div>
</footer>

</body>
</html>
