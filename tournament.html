<!DOCTYPE html>
<html>
<head>
<title>Esports Info</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* BODY */
body {
    margin: 0;
    font-family: Arial;
    background: white;
    color: black;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    background: #000;
    color: white;
}

/* LOGO */
.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo img {
    width: 40px;
}

.logo h2 {
    color: white;
    font-size: 18px;
}

/* MENU */
.menu {
    color: white;
    font-size: 26px;
    cursor: pointer;
}

/* DROPDOWN */
.dropdown {
    display: none;
    position: absolute;
    right: 10px;
    top: 60px;
    background: #111;
    padding: 10px;
    border-radius: 10px;
    z-index: 2000;
}

.dropdown a {
    display: block;
    color: white;
    padding: 10px;
    text-decoration: none;
}

.dropdown a:hover {
    background: orange;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: center;
    background: #1E90FF;
    flex-wrap: wrap;
}

.navbar a {
    text-decoration: none;
    color: white;
    padding: 15px 20px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 5px;
    transition: 0.3s;
}

.navbar a:hover,
.navbar a.active {
    background: white;
    color: black;
}

/* CONTENT */
.content {
    text-align: center;
    padding: 20px;
}

/* TEAM GRID */
.teams {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
    padding: 20px;
}

/* TEAM CARD */
.team-card {
    background: #111;
    border-radius: 15px;
    width: 200px;
    padding: 15px;
    transition: 0.3s;
    cursor: pointer;
}

.team-card img {
    width: 100%;
    border-radius: 10px;
}

.team-card:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px orange;
}

/* BACK */
a {
    color: orange;
    text-decoration: none;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 10px;
}

/* 🔥 MOBILE RESPONSIVE */
@media (max-width: 600px) {

    .logo h2 {
        font-size: 14px;
    }

    .navbar a {
        padding: 10px;
        font-size: 14px;
    }

    .menu {
        font-size: 22px;
    }

}

</style>

<script>
function toggleMenu() {
    var menu = document.getElementById("dropdown");
    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }
}
</script>

</head>

<body>

<!-- HEADER -->
<header>
    <div class="logo">
        <img src="lgo.png">
        <h2>ESPORTS INFO</h2>
    </div>
    
    <div class="menu" onclick="toggleMenu()">☰</div>
</header>

<!-- DROPDOWN -->
<div id="dropdown" class="dropdown">
    <a href="#">Instagram</a>
    <a href="#">WhatsApp</a>
    <a href="#">X</a>
</div>

<!-- NAVBAR -->
<div class="navbar">
    <a href="index.html">Home</a>
    <a href="tournament.html" class>Tournament</a>
    <a href="team.html" class="active">Player</a>
    <a href="ranking.html">Ranking</a>
</div>

<!-- CONTENT -->
<h1 style="text-align:center;">On Going Tournament</h1>
    

<div class="teams">

    <a href="ffmic2026springinfo.html">
        <div class="team-card">
            <img src="ffmic2026springlogo.png">
            <h3>FFMIC 2026 SPRING</h3>
        </div>
    </a>
  
    <a href="index.html">⬅ Back to Home</a>

</div>

<!-- FOOTER -->
<footer>
    <p>© 2026 Esports Info</p>
</footer>

</body>
</html>
