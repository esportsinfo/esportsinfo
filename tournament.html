<!DOCTYPE html>

<head>
<title>Teams - Esports Info</title>

<style>
body {
    background: #0a0a0a;
    color: white;
    font-family: Arial;
    margin: 0;
    text-align: center;
    border: Orange;
}

/* HEADER */
h2 {
    color: orange;
    padding: 20px;
}

/* TEAM GRID */
.teams {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
    padding: 20px;
}

/* TEAM CARD */
.team-card {
    background: White;
    border-radius: 10px;
    width: 150px;
    padding: 15px;
    transition: 0.3s;
    cursor: pointer;
}

.team-card img {
    width: 100%;
    border-radius: 10px;
}

.team-card:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px orange;
}

/* BACK */
a {
    color: orange;
    text-decoration: none;
}
    /* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    background: black;
    border-bottom: ;
}

/* LOGO */
.logo {
    display: flex;
    align-items: center;
    gap: 5px;
}

.logo img {
    height: 120px;
}

.logo span {
    color: White;
    font-size: 30px;
    font-weight: bold;
}

/* MENU */
.menu {
    font-size: 25px;
    cursor: pointer;
}

/* DROPDOWN */
.dropdown {
    display: none;
    position: absolute;
    right: 10px;
    top: 60px;
    background: #111;
    padding: 10px;
    border-radius: 10px;
}

.dropdown a {
    display: block;
    color: white;
    padding: 10px;
    text-decoration: none;
}

.dropdown a:hover {
    background: orange;
}
    /* NAVBAR */
.navbar {
    display: flex;
    justify-content: center;
    background: #1E90FF;
    border-bottom: 1px solid #222;
}

.navbar a {
    position: relative;
    text-decoration: none;
    color: white;
    padding: 20px 30px;
    font-size: 18px;
    font-weight: bold;
    transition: 0.3s;
}

.navbar a:hover {
    color: orange;
}

.navbar a::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 10px;
    width: 0;
    height: 2px;
    background: orange;
    transition: 0.3s;
    transform: translateX(-50%);
}

.navbar a:hover::after {
    width: 60%;
}

/* ACTIVE */
.active {
    color: orange !important;
}

.active::after {
    width: 60%;
}
    .tag {
    background: white;
    border: 2px solid orange;
    color: Black;
    padding: 10px 20px;
    border-radius: 5px;
    font-size: 25px;
    font-weight: bold;
}
    .move {
    position: absolute;

    left: 15px;
    bottom: 30px;
}
    
</style>
    
<script>
    function toggleMenu() {
    var menu = document.getElementById("dropdown");
    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }
}
    function showSection(id) {
    document.getElementById("home").style.display = "none";
    document.getElementById("tournament").style.display = "none";
    document.getElementById("player").style.display = "none";
    document.getElementById("ranking").style.display = "none";

    document.getElementById(id).style.display = "block";
}
</script>

</head>

<body>
    <header>
    <div class="logo">
        <img src="lgo.png">
        <span>ESPORTS INFO</span>
    </div>

    <div class="menu" onclick="toggleMenu()">☰</div>
</header>

<div id="dropdown" class="dropdown">
    <a href="#">About</a>
    <a href="#">Contact</a>
</div>

<div class="navbar">

    <a href="tournament.html" class="active">Tournament</a>
    <a href="team.html"><div>Player</div></a>
    <a href="ranking.html"><div>Ranking</div></a>
</div>

<span class="tag move">ON GOING TOURNAMENT</span>

<div class="teams">

    <a href="#">
        <div class="team-card">
            <img src="ffmic2026springlogo.png">
            <h3>FFMIC 2026 SPRING</h3>
        </div>
    </a>

    <a href="#">
        <div class="team-card">
            <img src="image.png">
            <h3>Reckoning Esports</h3>
        </div>
    </a>

</div>

<br>

<a href="index.html">⬅ Back to Home</a>

</body>
</html>
