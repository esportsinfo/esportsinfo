<!DOCTYPE html>
<html>
<head>
<title>Esports Info</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* BODY */
body {
    margin: 0;
    font-family: Arial;
    background: white;
    color: black;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    background: #000;
    color: white;
}

/* LOGO */
.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo img {
    width: 40px;
}

.logo h2 {
    color: white;
    font-size: 18px;
}

/* MENU */
.menu {
    color: white;
    font-size: 26px;
    cursor: pointer;
}

/* DROPDOWN */
.dropdown {
    display: none;
    position: absolute;
    right: 10px;
    top: 60px;
    background: #111;
    padding: 10px;
    border-radius: 10px;
    z-index: 2000;
}

.dropdown a {
    display: block;
    color: white;
    padding: 10px;
    text-decoration: none;
}

.dropdown a:hover {
    background: orange;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: center;
    background: #1E90FF;
    flex-wrap: wrap;
}

.navbar a {
    text-decoration: none;
    color: white;
    padding: 15px 20px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 5px;
    transition: 0.3s;
}

.navbar a:hover,
.navbar a.active {
    background: white;
    color: black;
}

/* TEAM PROFILE */
.team-profile {
    background: #111;
    color: white;
    max-width: 280px;
    margin: 20px auto;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
}

.team-profile img {
    width: 100px;
    height: 100px;
    object-fit: contain;
}

.info {
    color: #ccc;
    font-size: 14px;
}

.stats {
    display: flex;
    justify-content: space-around;
    margin-top: 10px;
}

.stat-box {
    background: #222;
    padding: 6px;
    border-radius: 8px;
    width: 30%;
    font-size: 12px;
}

.desc {
    margin-top: 10px;
    font-size: 13px;
    color: #ddd;
}

.player-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
}

.player {
    background: #000;
    padding: 6px;
    border-radius: 8px;
    width: 70px;
    text-align: center;
}

.player img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
}

/* BACK */
.back {
    display: block;
    text-align: center;
    margin: 20px;
    color: orange;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 10px;
}

/* MOBILE */
@media (max-width: 600px) {
    .navbar a {
        padding: 10px;
        font-size: 14px;
    }
}

</style>

<script>
function toggleMenu() {
    var menu = document.getElementById("dropdown");
    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }
}
</script>

</head>

<body>

<!-- HEADER -->
<header>
    <div class="logo">
        <img src="lgo.png">
        <h2>ESPORTS INFO</h2>
    </div>
    
    <div class="menu" onclick="toggleMenu()">☰</div>
</header>

<!-- DROPDOWN -->
<div id="dropdown" class="dropdown">
    <a href="#">Instagram</a>
    <a href="#">WhatsApp</a>
    <a href="#">X</a>
</div>

<!-- NAVBAR -->
<div class="navbar">
    <a href="index.html">Home</a>
    <a href="tournament.html">Tournament</a>
    <a href="team.html" class="active">Player</a>
    <a href="ranking.html">Ranking</a>
</div>

<!-- TEAM PROFILE -->
<div class="team-profile">

    <img src="godlike.png">

    <h2>Godlike Esports</h2>
    <p class="info">India • BGMI Team</p>

    <div class="stats">
        <div class="stat-box">
            <h3>25</h3>
            <p>Wins</p>
        </div>

        <div class="stat-box">
            <h3>120</h3>
            <p>Matches</p>
        </div>

        <div class="stat-box">
            <h3>5</h3>
            <p>Trophies</p>
        </div>
    </div>

    <p class="desc">
        One of the most dominant esports teams known for aggressive gameplay.
    </p>

    <h3>Players</h3>

    <div class="player-list">

        <div class="player">
            <img src="player1.jpg">
            <p>Jonathan</p>
        </div>

        <div class="player">
            <img src="player2.jpg">
            <p>ClutchGod</p>
        </div>

        <div class="player">
            <img src="player3.jpg">
            <p>Neyoo</p>
        </div>

        <div class="player">
            <img src="player4.jpg">
            <p>ZGod</p>
        </div>

    </div>

</div>

<!-- BACK -->
<a href="tournament.html" class="back">⬅ Back</a>

<!-- FOOTER -->
<footer>
    <p>© 2026 Esports Info</p>
</footer>

</body>
</html>
