<!DOCTYPE html>
<html>
<head>
<title>BLACK SHARK ESPORTS</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0a0a0a;
    color: white;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    font-weight: bold;
    background: black;
}

.logo {
    color: orange;
    font-size: 40px;
    font-weight: bold;
}

/* HAMBURGER MENU */
.menu {
    font-size: 40px;
    cursor: pointer;
    font-weight: bold;
}

/* DROPDOWN */
.dropdown {
    display: none;
    position: absolute;
    right: 10px;
    top: 60px;
    background: #111;
    padding: 10px;
    border-radius: 10px;
}

.dropdown a {
    display: block;
    color: white;
    padding: 10px;
    text-decoration: none;
}

.dropdown a:hover {
    background: ;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: center;
    background:#1E90FF;
}

.navbar div {
    padding: 25px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1px;
}

.navbar div:hover {
    color: White;
}

/* CONTENT */
.content {
    padding: 80px;
    text-align: center;
}

/* FOOTER */
footer {
    background: black;
    text-align: center;
    padding: 20px;
    border-top: 2px White;
}
</style>

<script>
function showSection(id) {
    document.getElementById("Home").style.display = "none";
    document.getElementById("Tournament").style.display = "none";
    document.getElementById("Player").style.display = "none";
    document.getElementById("Ranking").style.display = "none";

    document.getElementById(id).style.display = "block";
}
</script>

</head>

<body>

<header>
    <div class="logo" style="display:flex; align-items:center; gap:3px;">
    <img src="lgo.png" style="height:120px;">
    <span style="font-size:30px; font-weight:bold; color:white;">
        ESPORTS INFO 
    </span>
</div>
    <div class="menu" onclick="toggleMenu()">☰</div>
</header>

<div id="dropdown" class="dropdown">
    <a href="#">About</a>
    <a href="#">Contact</a>
    <a href="#">Join Team</a>
</div>

<div class="navbar">
<div onclick="showSection('home')">Home</div>
<div onclick="showSection('tournament')">Tournament</div>
<div onclick="showSection('player')">Player</div>
<div onclick="showSection('ranking')">Ranking</div>
</div>

<div id="Home" class="content">
    <h2>Welcome to Esports Info World</h2>
    <p>FFM Esports Coverage.</p>
</div>

<div id="Tournament" class="content" style="display:none;">
    <h2>🏆 Tournament</h2>
    <p>Upcoming matches will be shown here</p>
</div>

<div id="Player" class="content" style="display:none;">
    <h2>🎯 Players</h2>
    <p>Player list coming soon</p>
</div>

<div id="Ranking" class="content" style="display:none;">
    <h2>📊 Ranking</h2>
    <p>Leaderboard coming soon</p>
</div>

<footer>
    <p>© 2026 ESPORTS INFO | Instagram | YouTube | Discord</p>
</footer>

</body>
</html>
