<!DOCTYPE html>
<html>
<head>
<title>BLACK SHARK ESPORTS</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0a0a0a;
    color: white;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    background: black;
    border-bottom: 2px solid orange;
}

.logo {
    color: orange;
    font-size: 20px;
    font-weight: bold;
}

/* HAMBURGER MENU */
.menu {
    font-size: 25px;
    cursor: pointer;
}

/* DROPDOWN */
.dropdown {
    display: none;
    position: absolute;
    right: 10px;
    top: 60px;
    background: #111;
    padding: 10px;
    border-radius: 10px;
}

.dropdown a {
    display: block;
    color: white;
    padding: 10px;
    text-decoration: none;
}

.dropdown a:hover {
    background: orange;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: center;
    background: Blue;
}

.navbar div {
    padding: 15px;
    cursor: pointer;
}

.navbar div:hover {
    color: orange;
}

/* CONTENT */
.content {
    padding: 40px;
    text-align: center;
}

/* FOOTER */
footer {
    background: black;
    text-align: center;
    padding: 20px;
    border-top: 2px solid orange;
}
</style>

<script>
function toggleMenu() {
    var menu = document.getElementById("dropdown");
    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }
}

function showPage(page) {
    document.getElementById("content").innerHTML = page;
}
</script>

</head>

<body>

<header>
    <div class="logo">
    <img src="logo.png" style="height:150px;">
</div>
    <div class="menu" onclick="toggleMenu()">☰</div>
</header>

<div id="dropdown" class="dropdown">
    <a href="#">About</a>
    <a href="#">Contact</a>
    <a href="#">Join Team</a>
</div>

<div class="navbar">
    <div onclick="showPage('🏠 Welcome to Black Shark Esports')">Home</div>
    <div onclick="showPage('🏆 Tournament coming soon')">Tournament</div>
    <div onclick="showPage('🎯 Player list coming soon')">Player</div>
    <div onclick="showPage('📊 Ranking will be updated')">Ranking</div>
</div>

<div id="content" class="content">
    <h2> Welcome to Esports Info</h2>
    <p>Your gaming journey starts here</p>
</div>

<footer>
    <p>© 2026 ESPORTS Info | Instagram | YouTube | Discord</p>
</footer>

</body>
</html>
