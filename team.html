<!DOCTYPE html>

<head>
<title>Esports Info</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BODY */
body {
    margin: 0;
    font-family: Arial;
    background: #0a0a0a;
    color: white;
}
    .main-content {
    background: white;
    color: black;
    min-height: auto;
    padding: 20px;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    background: #000;
}

/* LOGO */
.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo img {
    width: 40px;
}

.logo h2 {
    font-size: 18px;
}

/* MENU */
.menu {
    font-size: 26px;
    cursor: pointer;
}

/* DROPDOWN */
.dropdown {
    display: none;
    position: absolute;
    right: 10px;
    top: 60px;
    background: #111;
    padding: 10px;
    border-radius: 10px;
    z-index: 2000;
}

.dropdown a {
    display: block;
    color: white;
    padding: 10px;
    text-decoration: none;
}

.dropdown a:hover {
    background: orange;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: center;
    background: #1E90FF;
    flex-wrap: wrap;
}

.navbar a {
    text-decoration: none;
    color: white;
    padding: 15px 20px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 5px;
    transition: 0.3s;
}

.navbar a:hover,
.navbar a.active {
    background: white;
    color: black;
}

    .main-content {
    background: white;
    color: black;
    min-height: 100vh;
    padding-bottom: 20px;
}

/* TEAM GRID */
.team-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 20px;
    padding: 20px;
    max-width: 1000px;
    margin: auto;
}

/* TEAM CARD */
.team-card {
    background: #111;
    border-radius: 12px;
    padding: 15px;
    height: 140px;
    border: 1px solid #222;
    transition: 0.3s ease;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.team-card img {
    width: 60px;
    height: 60px;
    object-fit: contain;
    margin-bottom: 10px;
}

.team-card h3 {
    font-size: 14px;
    color: orange;
    text-align: center;
}

.team-card:hover {
    transform: scale(1.08);
    box-shadow: 0 0 15px #00bfff;
}

   /* BACK */
a {
    color: orange;
    text-align: center;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 10px;
    margin-top: 10px;
}

/* MOBILE */
@media (max-width: 600px) {
    .logo h2 {
        font-size: 14px;
    }

    .navbar a {
        padding: 10px;
        font-size: 14px;
    }

    .menu {
        font-size: 22px;
    }
}

</style>

<script>
function toggleMenu() {
    var menu = document.getElementById("dropdown");
    menu.style.display = (menu.style.display === "block") ? "none" : "block";
}
</script>

</head>
